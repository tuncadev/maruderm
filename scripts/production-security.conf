# BEGIN Maruderm security
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteRule (^|/)\.(?!well-known(?:/|$)) - [F,L,NC]
</IfModule>
<FilesMatch "(?i)^(?:\.env(?:\..*)?|wp-config\.php(?:\..*)?|composer\.(?:json|lock)|package(?:-lock)?\.json)$">
Require all denied
</FilesMatch>
<IfModule mod_headers.c>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000"
Header always set Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always unset X-Powered-By
</IfModule>
# END Maruderm security
