name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast-forward production checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Pull master on production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          remote_path=$(printf '%q' "${DEPLOY_PATH}")
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=${remote_path} bash -s" <<'REMOTE'
          set -euo pipefail

          if ! git -C "${DEPLOY_PATH}" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            matches=()
            while IFS= read -r git_dir; do
              candidate=${git_dir%/.git}
              case "${candidate}" in
                */.codex-backups/*|*/next-releases/*|*/deploy-incoming/*) continue ;;
              esac
              if [ "$(git -C "${candidate}" remote get-url origin 2>/dev/null || true)" = "https://github.com/tuncadev/maruderm.git" ]; then
                matches+=("${candidate}")
              fi
            done < <(find /home/citymody -maxdepth 6 -type d -name .git -print)

            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one production Maruderm checkout; found ${#matches[@]}." >&2
              exit 1
            fi

            DEPLOY_PATH=${matches[0]}
            printf 'resolved_deploy_path=%s\n' "${DEPLOY_PATH}"
          fi

          cd "${DEPLOY_PATH}"

          test "$(git branch --show-current)" = "master"
          test "$(git remote get-url origin)" = "https://github.com/tuncadev/maruderm.git"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Production worktree is dirty; refusing deployment." >&2
            git status --short >&2
            exit 1
          fi

          before_commit=$(git rev-parse HEAD)
          git pull --ff-only origin master
          after_commit=$(git rev-parse HEAD)

          printf 'before_commit=%s\n' "${before_commit}"
          printf 'after_commit=%s\n' "${after_commit}"

          if command -v wp >/dev/null 2>&1; then
            wp cache flush || true
          fi
          REMOTE
