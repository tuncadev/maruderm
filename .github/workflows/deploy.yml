name: Deploy production

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Fast-forward production checkout
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT}" "${DEPLOY_HOST}" > ~/.ssh/known_hosts
          fi

      - name: Pull master on production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          remote_path=$(printf '%q' "${DEPLOY_PATH}")
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "DEPLOY_PATH=${remote_path} bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          test "$(git branch --show-current)" = "master"
          test "$(git remote get-url origin)" = "https://github.com/tuncadev/maruderm.git"

          if [ -n "$(git status --porcelain)" ]; then
            echo "Production worktree is dirty; refusing deployment." >&2
            git status --short >&2
            exit 1
          fi

          before_commit=$(git rev-parse HEAD)
          git pull --ff-only origin master
          after_commit=$(git rev-parse HEAD)

          printf 'before_commit=%s\n' "${before_commit}"
          printf 'after_commit=%s\n' "${after_commit}"

          if command -v wp >/dev/null 2>&1; then
            wp cache flush || true
          fi
          REMOTE
